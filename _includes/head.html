<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<script>
document.addEventListener("DOMContentLoaded", function() {
    // 1. Copy Code Button
    document.querySelectorAll('div.highlight').forEach(function(highlightDiv) {
        var button = document.createElement('button');
        button.className = 'copy-code-btn';
        button.type = 'button';
        button.ariaLabel = 'Copy code to clipboard';
        button.innerHTML = '<i class="far fa-copy"></i>';

        highlightDiv.style.position = 'relative';
        highlightDiv.appendChild(button);

        button.addEventListener('click', function() {
            var code = highlightDiv.querySelector('code').innerText.trim();
            navigator.clipboard.writeText(code).then(function() {
                button.innerHTML = '<i class="fas fa-check" style="color: #28a745;"></i>';
                button.classList.add('copied');
                setTimeout(function() {
                    button.innerHTML = '<i class="far fa-copy"></i>';
                    button.classList.remove('copied');
                }, 2000);
            }).catch(function(err) {
                console.error('Could not copy text: ', err);
            });
        });
    });

    // 2. GitHub-style Markdown Alerts Parser
    document.querySelectorAll('blockquote').forEach(function(bq) {
        var firstEl = bq.firstElementChild;
        if (!firstEl) return;
        
        var text = firstEl.innerHTML.trim();
        var match = text.match(/^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]([\s\S]*)/i);
        if (match) {
            var type = match[1].toUpperCase();
            var content = match[2].trim();
            
            content = content.replace(/^(?:<br\s*\/?>|\s)+/i, '');
            firstEl.innerHTML = content;
            if (firstEl.innerHTML.trim() === '') {
                firstEl.remove();
            }
            
            bq.className = 'markdown-alert markdown-alert-' + type.toLowerCase();
            
            var titleDiv = document.createElement('div');
            titleDiv.className = 'markdown-alert-title';
            
            var iconHtml = '';
            var titleText = '';
            if (type === 'NOTE') {
                iconHtml = '<i class="fas fa-info-circle"></i>';
                titleText = 'Note';
            } else if (type === 'TIP') {
                iconHtml = '<i class="far fa-lightbulb"></i>';
                titleText = 'Tip';
            } else if (type === 'IMPORTANT') {
                iconHtml = '<i class="fas fa-exclamation-circle"></i>';
                titleText = 'Important';
            } else if (type === 'WARNING') {
                iconHtml = '<i class="fas fa-exclamation-triangle"></i>';
                titleText = 'Warning';
            } else if (type === 'CAUTION') {
                iconHtml = '<i class="fas fa-hand-paper"></i>';
                titleText = 'Caution';
            }
            
            titleDiv.innerHTML = iconHtml + '<span>' + titleText + '</span>';
            bq.insertBefore(titleDiv, bq.firstChild);
        }
    });
});
</script>
