<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<script>
document.addEventListener("DOMContentLoaded", function() {
    document.querySelectorAll('div.highlight').forEach(function(highlightDiv) {
        var button = document.createElement('button');
        button.className = 'copy-code-btn';
        button.type = 'button';
        button.ariaLabel = 'Copy code to clipboard';
        button.innerHTML = '<i class="far fa-copy"></i>';

        highlightDiv.style.position = 'relative';
        highlightDiv.appendChild(button);

        button.addEventListener('click', function() {
            var code = highlightDiv.querySelector('code').innerText.trim();
            navigator.clipboard.writeText(code).then(function() {
                button.innerHTML = '<i class="fas fa-check" style="color: #28a745;"></i>';
                button.classList.add('copied');
                setTimeout(function() {
                    button.innerHTML = '<i class="far fa-copy"></i>';
                    button.classList.remove('copied');
                }, 2000);
            }).catch(function(err) {
                console.error('Could not copy text: ', err);
            });
        });
    });
});
</script>
